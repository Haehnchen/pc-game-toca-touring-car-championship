name: Nightly release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            gcc-14 g++-14 cmake git ninja-build pkg-config python3 unzip \
            zstd imagemagick \
            libasound2-dev libdbus-1-dev libdecor-0-dev libdrm-dev \
            libegl1-mesa-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libibus-1.0-dev libpipewire-0.3-dev libpulse-dev libudev-dev \
            libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev \
            libxi-dev libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev

      - name: Cache locked dependency sources
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/dependencies/archives
            build/dependencies/sources
          key: dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/dependencies.lock.json', 'cmake/Dependencies.cmake') }}

      - name: Build and package Linux
        run: |
          cmake --preset distribution
          cmake --build --preset distribution
          python3 tools/package_release.py --build-dir build/dist
          python3 tools/verify-release.py --platform Linux

      - name: Check extracted Linux executable without library overrides
        run: |
          toca_package_dir=$(mktemp -d "$RUNNER_TEMP/TOCA release with spaces.XXXXXX")
          trap 'rm -rf "$toca_package_dir"' EXIT
          unzip -q dist/toca-Linux-x86_64.zip -d "$toca_package_dir"
          python3 - "$toca_package_dir/toca" <<'PY'
          import os
          import subprocess
          import sys
          environment = {key: value for key, value in os.environ.items() if not key.startswith("LD_")}
          subprocess.run([sys.argv[1], "--help"], cwd=os.environ["RUNNER_TEMP"], env=environment, check=True)
          PY

      - name: Store Linux ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-linux-x86_64
          path: dist/toca-Linux-x86_64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build Windows toolchain image
        run: docker build -f tools/ci/windows.Dockerfile -t toca-windows-build tools/ci

      - name: Cache locked dependency sources
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            build/dependencies/archives
            build/dependencies/sources
          key: dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/dependencies.lock.json', 'cmake/Dependencies.cmake') }}

      - name: Build and verify full Mega Windows package
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" --workdir /work \
            toca-windows-build python3 tools/build-windows.py

      - name: Store Windows ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-windows-x86_64
          path: dist/windows/toca-Windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    if: ${{ success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out archive verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nightly-*
          path: dist
          merge-multiple: true

      - name: Verify complete release set
        run: python3 tools/verify-release.py --platform Linux --platform Windows

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=nightly
          notes="Build of ${GITHUB_SHA}."

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              --raw-field sha="$GITHUB_SHA" --field force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              --raw-field ref="refs/tags/${tag}" --raw-field sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Nightly build" --notes "$notes" --prerelease
          else
            gh release create "$tag" --verify-tag \
              --title "Nightly build" --notes "$notes" --prerelease
          fi
          gh release upload "$tag" dist/*.zip --clobber
